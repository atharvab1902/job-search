services:
  postgres:
    image: postgres:16-alpine
    container_name: job-search-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: jobsearch123
      POSTGRES_DB: jobsearch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: job-search-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobsearch:jobsearch123@postgres:5432/jobsearch?schema=public
      JWT_SECRET: job-search-super-secret-jwt-key-change-in-production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ai_workspace:/app/ai-workspace
      - C:/Users/athar/.gmail-mcp:/home/node/.gmail-mcp:ro
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    container_name: job-search-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ai_workspace:
